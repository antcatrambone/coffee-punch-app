<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Shop Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img id="logoImg" class="logo-img" src="logo.webp" alt="" onerror="this.style.display='none'" />
      <h1 id="shopName">Shop Stats</h1>
      <p id="shopTagline">Live loyalty program totals</p>
    </div>

    <!-- PIN gate -->
    <div class="panel" id="pinPanel">
      <label for="pin">Staff PIN</label>
      <input id="pin" type="password" inputmode="numeric" placeholder="••••" />
      <button id="pinBtn">View stats</button>
      <div class="error" id="pinError"></div>
    </div>

    <!-- Stats -->
    <div id="statsPanel" style="display:none;">
      <div class="stats-grid">
        <div class="stat-tile">
          <div class="stat-number" id="statPunches">–</div>
          <div class="stat-label">Total Punches Given</div>
        </div>
        <div class="stat-tile">
          <div class="stat-number" id="statRedeemed">–</div>
          <div class="stat-label">Rewards Redeemed</div>
        </div>
        <div class="stat-tile">
          <div class="stat-number" id="statCustomers">–</div>
          <div class="stat-label">Total Customers</div>
        </div>
        <div class="stat-tile">
          <div class="stat-number" id="statOutstanding">–</div>
          <div class="stat-label">Rewards Ready to Redeem</div>
        </div>
      </div>
      <div class="staff-status" id="liveNote">Updates live — leave this page open.</div>
      <button class="switch-link" id="lockBtn">Lock stats</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/config.js"></script>
  <script src="js/stats.js"></script>
</body>
</html>
