<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Coffee Club Punch Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img id="logoImg" class="logo-img" src="logo.webp" alt="" onerror="this.style.display='none'" />
      <h1 id="shopName">Coffee Club Punch Card</h1>
      <p id="shopTagline">Buy 5, get the 6th free</p>
    </div>

    <div class="panel">
      <p style="margin:0;font-size:0.9rem;">Enter your email or phone — we'll remember you!</p>

      <label for="firstName">First name</label>
      <input id="firstName" type="text" placeholder="Jane" autocomplete="given-name" />

      <label for="lastName">Last name</label>
      <input id="lastName" type="text" placeholder="Doe" autocomplete="family-name" />

      <label for="email">Email address</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />

      <label for="phone">Phone number</label>
      <input id="phone" type="tel" placeholder="(555) 123-4567" autocomplete="tel" />

      <label for="birthdayMonth">Birthday <span style="font-weight:400;">(get a free coffee that day!)</span></label>
      <div class="birthday-row">
        <select id="birthdayMonth" aria-label="Birthday month"></select>
        <select id="birthdayDay" aria-label="Birthday day"></select>
      </div>

      <label class="checkbox-row" for="marketingOptIn">
        <input type="checkbox" id="marketingOptIn" />
        <span>Yes, send me occasional emails or texts about new flavors, rewards, and promotions.</span>
      </label>

      <button id="submitBtn">Get my punch card</button>
      <div class="error" id="errorMsg"></div>
    </div>

    <p class="hint">Only email or phone is required — everything else is optional.</p>
    <p class="hint">We only use this to track your punch card and birthday reward — we won't sell it or spam you.</p>
  </div>

  <script src="js/config.js"></script>
  <script>
    document.getElementById('shopName').textContent = window.SHOP_CONFIG.name;
    document.getElementById('shopTagline').textContent = window.SHOP_CONFIG.tagline;

    const firstNameInput = document.getElementById('firstName');
    const lastNameInput = document.getElementById('lastName');
    const emailInput = document.getElementById('email');
    const phoneInput = document.getElementById('phone');
    const birthdayMonthInput = document.getElementById('birthdayMonth');
    const birthdayDayInput = document.getElementById('birthdayDay');
    const marketingOptInInput = document.getElementById('marketingOptIn');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    // We only ever need month + day (the reward check ignores birth year
    // entirely), so there's no calendar widget and no year to get wrong.
    const MONTH_NAMES = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December',
    ];
    // A fixed, always-past leap year used only so "Feb 29" is a valid
    // date to construct — it's never shown to the customer or read back.
    const PLACEHOLDER_YEAR = 2000;

    function daysInMonth(month) {
      return new Date(PLACEHOLDER_YEAR, month, 0).getDate();
    }

    function populateMonths() {
      birthdayMonthInput.innerHTML = '<option value="">Month</option>';
      MONTH_NAMES.forEach((name, i) => {
        const opt = document.createElement('option');
        opt.value = String(i + 1);
        opt.textContent = name;
        birthdayMonthInput.appendChild(opt);
      });
    }

    function populateDays() {
      const prevSelection = birthdayDayInput.value;
      const month = parseInt(birthdayMonthInput.value, 10);
      const max = month ? daysInMonth(month) : 31;
      birthdayDayInput.innerHTML = '<option value="">Day</option>';
      for (let d = 1; d <= max; d++) {
        const opt = document.createElement('option');
        opt.value = String(d);
        opt.textContent = String(d);
        birthdayDayInput.appendChild(opt);
      }
      // Keep the day selected if it's still valid for the new month
      // (e.g. switching off Feb shouldn't silently clear day 29).
      if (prevSelection && parseInt(prevSelection, 10) <= max) {
        birthdayDayInput.value = prevSelection;
      }
    }

    populateMonths();
    populateDays();
    birthdayMonthInput.addEventListener('change', populateDays);

    function getBirthdayValue() {
      const month = birthdayMonthInput.value;
      const day = birthdayDayInput.value;
      if (!month || !day) return '';
      return `${PLACEHOLDER_YEAR}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
    }

    // Auto-load a card already created on this device.
    const savedToken = localStorage.getItem('punchCardToken');
    if (savedToken) {
      window.location.href = `card.html?token=${encodeURIComponent(savedToken)}`;
    }

    submitBtn.addEventListener('click', async () => {
      errorMsg.textContent = '';
      const firstName = firstNameInput.value.trim();
      const lastName = lastNameInput.value.trim();
      const email = emailInput.value.trim();
      const phone = phoneInput.value.trim();
      const birthday = getBirthdayValue();
      const marketingOptIn = marketingOptInInput.checked;

      if (!email && !phone) {
        errorMsg.textContent = 'Enter an email address or phone number.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'One sec…';

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ firstName, lastName, email, phone, birthday, marketingOptIn }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong.');

        localStorage.setItem('punchCardToken', data.token);
        window.location.href = `card.html?token=${encodeURIComponent(data.token)}`;
      } catch (err) {
        errorMsg.textContent = err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Get my punch card';
      }
    });
  </script>
</body>
</html>
