<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Coffee Punch Card</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <h1 id="shopName">☕ Coffee Punch Card</h1>
      <p id="shopTagline">Buy 10, get the 11th free</p>
    </div>

    <div class="panel">
      <p style="margin:0;font-size:0.9rem;">Get your card with your email or phone number. It'll load automatically next time on this device — or scan back in with either one.</p>

      <label for="email">Email address</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />

      <label for="phone">Phone number</label>
      <input id="phone" type="tel" placeholder="(555) 123-4567" autocomplete="tel" />

      <button id="submitBtn">Get my punch card</button>
      <div class="error" id="errorMsg"></div>
    </div>

    <p class="hint">Only one is required — fill in whichever you'd rather use.</p>
  </div>

  <script src="js/config.js"></script>
  <script>
    document.getElementById('shopName').textContent = '☕ ' + window.SHOP_CONFIG.name;
    document.getElementById('shopTagline').textContent = window.SHOP_CONFIG.tagline;

    const emailInput = document.getElementById('email');
    const phoneInput = document.getElementById('phone');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    // Auto-load a card already created on this device.
    const savedToken = localStorage.getItem('punchCardToken');
    if (savedToken) {
      window.location.href = `card.html?token=${encodeURIComponent(savedToken)}`;
    }

    submitBtn.addEventListener('click', async () => {
      errorMsg.textContent = '';
      const email = emailInput.value.trim();
      const phone = phoneInput.value.trim();

      if (!email && !phone) {
        errorMsg.textContent = 'Enter an email address or phone number.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'One sec…';

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, phone }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong.');

        localStorage.setItem('punchCardToken', data.token);
        window.location.href = `card.html?token=${encodeURIComponent(data.token)}`;
      } catch (err) {
        errorMsg.textContent = err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Get my punch card';
      }
    });
  </script>
</body>
</html>
